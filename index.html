<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Paddock Menu | SpeedBay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--bg:#121212;--card:#1c1c1c;--txt:#f4f4f4;--mut:#a9a9a9;--acc:#fdb515;--red:#e63b2e;--line:#2c2c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#121212}}
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
header{text-align:center;padding:28px 16px 18px;background:repeating-linear-gradient(45deg,#161616 0 14px,#1b1b1b 14px 28px);border-bottom:4px solid var(--acc)}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:56px;letter-spacing:2px;color:var(--acc);margin:0;line-height:1}
.tag{font-style:italic;font-weight:700;margin:6px 0 0;color:var(--txt)}
.tbl{display:inline-block;margin-top:12px;background:var(--red);color:#fff;font-weight:700;padding:4px 14px;border-radius:99px;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--txt);text-decoration:none;font-family:'Bebas Neue',Impact,sans-serif;font-size:19px;letter-spacing:1px;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
nav a:focus-visible,nav a:active{background:var(--acc);color:#111;outline:none}
main{max-width:640px;margin:0 auto;padding:0 14px 30px}
h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:1.5px;margin:30px 0 4px;color:var(--acc);border-left:5px solid var(--red);padding-left:10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 6px 15px}
.it{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.it h3{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:23px;letter-spacing:.5px}
.it p{margin:2px 0 0;color:var(--mut);font-size:14px}
.pr{white-space:nowrap;font-weight:700;color:var(--txt);text-align:right;font-size:15px}
.pr span{display:block}
.b{display:inline-block;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.v{background:#2eaa4a;color:#fff}.c{background:var(--acc);color:#111}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 16px 34px}
</style>
</head>
<body>
<header>

<p class="tag">Where flavours hit top gear!</p>
<div class="tbl" id="tbl" hidden></div>
</header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer>Prices include all applicable government taxes and service charge.<br>Follow us @speedbaylk @paddockrestaurant<br>T: +94 11 422 6000</footer>

</html>
